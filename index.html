<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Turner</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-green-50">

    <header class="flex flex-col md:flex-row md:justify-between items-center bg-slate-200 px-8 py-3">
        <p class="text-2xl font-bold text-slate-900">Page Turner</p>
        <nav class="flex gap-8">
            <a class="text-[16px] text-slate-600 hover:underline" href="index.html">Browse</a>
            <a class="text-[16px] text-slate-600 hover:underline" href="index.html">Shop</a>
        </nav>
    </header>

    <main class="p-6 max-w-3xl mx-auto">
        <h1 class="text-3xl text-slate-900 font-bold mb-6">Staff Picks</h1>
        <p class="text-[18px] text-slate-600 mb-3">What we are pressing into people’s hands this month.</p>
    </main>

    <div class="grid sm:grid-cols-1 md:grid-cols-3 gap-6 max-w-3xl mx-auto">

        <div class="bg-white border-2 border-slate-200 rounded-xl p-4 flex flex-col mx-auto">
            <img class="object-cover rounded-lg w-[268px]" src="assets/moby.jpg" alt="Moby-Dick cover">
            <h3 class="text-xl font-bold mt-4">Moby-Dick</h3>
            <p class="block text-sm text-slate-600 leading-relaxed">Herman Melville</p>

            <div class="flex justify-between items-center mt-auto">
                <span class="font-semibold text-xl text-teal-700">$12</span>
            </div>
        </div>

        <div class="bg-white border-2 border-slate-200 rounded-xl p-4 flex flex-col mx-auto">
            <img class="object-cover rounded-lg w-[268px]" src="assets/frank.jpg" alt="Frankenstein cover">
            <h3 class="text-xl font-bold mt-4">Frankenstein</h3>
            <p class="block text-sm text-slate-600 leading-relaxed">Mary Shelley</p>

            <div class="flex justify-between items-center mt-auto">
                <span class="font-semibold text-xl text-teal-700">$14</span>
            </div>
        </div>

        <div class="bg-white border-2 border-slate-200 rounded-xl p-4 flex flex-col mx-auto">
            <img class="object-cover rounded-lg w-[268px]" src="assets/call.jpg" alt="The Call of the Wild cover">
            <h3 class="text-xl font-bold mt-4">The Call of the Wild</h3>
            <p class="block text-sm text-slate-600 leading-relaxed">Jack London</p>

            <div class="flex justify-between items-center mt-auto">
                <span class="font-semibold text-xl text-teal-700">$9</span>
            </div>
        </div>

    </div>

    <div class="bg-teal-700 rounded-[8px] p-[16px] flex items-center justify-center w-[234px] mx-auto m-[48px]">
         <p class="text-[18px] text-white font-semibold ">Browse the shelves</p>
        
    </div>

</body>

</html>
